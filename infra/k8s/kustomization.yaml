apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lab-production

resources:
  - base-deployment.yaml
  - argocd-app.yaml
  - keda-scaledobject.yaml

commonLabels:
  lab.version: "4.0"
  managed-by: argocd

# Override for different environments using overlays:
#
# kustomize build infra/k8s/overlays/staging
# kustomize build infra/k8s/overlays/production
#
# Create overlays/ directory with per-env patches:
#   overlays/
#     staging/
#       kustomization.yaml  (replicas: 1, resources: minimal)
#     production/
#       kustomization.yaml  (replicas: 3, resources: full)
