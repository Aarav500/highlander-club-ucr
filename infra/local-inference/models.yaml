# Model Registry — which models to pull and their configurations
# Used by /local-llm workflow to set up inference backends

models:
  # --- Code Generation ---
  - name: deepseek-coder-v2:16b
    backend: ollama
    use_case: code_generation
    context_length: 128000
    quantization: q4_K_M
    priority: high

  - name: codellama:34b
    backend: ollama
    use_case: code_generation
    context_length: 16384
    quantization: q4_K_M
    priority: medium

  # --- General Reasoning ---
  - name: llama3.1:70b
    backend: vllm
    use_case: reasoning
    context_length: 32768
    quantization: none
    priority: high

  - name: mistral-large:latest
    backend: ollama
    use_case: reasoning
    context_length: 32768
    quantization: q4_K_M
    priority: medium

  # --- Fast / Small ---
  - name: phi-3:mini
    backend: ollama
    use_case: quick_edits
    context_length: 4096
    quantization: q4_K_M
    priority: low

  - name: gemma2:9b
    backend: ollama
    use_case: summarization
    context_length: 8192
    quantization: q4_K_M
    priority: low

  # --- Enterprise (NIM) ---
  - name: meta/llama-3.1-70b-instruct
    backend: nim
    use_case: enterprise
    context_length: 32768
    quantization: none
    priority: high
