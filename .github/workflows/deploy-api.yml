name: Deploy API to AWS EC2

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-node/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api-node/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-node
        run: npm ci

      - name: Run linting
        working-directory: apps/api-node
        run: npm run lint --if-present

      - name: Run tests
        working-directory: apps/api-node
        run: npm test --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send deploy command via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ec2-user/unipulse",
              "git pull origin main",
              "cd apps/api-node",
              "npm ci --omit=dev",
              "pm2 restart unipulse-api 2>/dev/null || pm2 start src/index.js --name unipulse-api",
              "pm2 save"
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command to complete
        run: |
          for i in $(seq 1 12); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i — Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          echo "❌ Deployment timed out after 120s"
          exit 1

      - name: Health check
        run: |
          echo "⏳ Waiting 10s for server to be ready..."
          sleep 10
          # Try health endpoint — requires EC2_PUBLIC_URL secret
          if [ -n "${{ secrets.EC2_PUBLIC_URL }}" ]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.EC2_PUBLIC_URL }}/health" || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP)"
            else
              echo "⚠️ Health check returned HTTP $HTTP — check EC2 logs"
            fi
          else
            echo "ℹ️ EC2_PUBLIC_URL not set — skipping HTTP health check"
          fi
