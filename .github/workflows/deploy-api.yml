name: Deploy API to AWS EC2

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-node/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api-node/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-node
        run: npm ci

      - name: Lint
        working-directory: apps/api-node
        run: npm run lint --if-present

      - name: Test
        working-directory: apps/api-node
        run: npm test --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test

  # ─── 2. Provision + Deploy ─────────────────────────────────────────────────
  deploy:
    name: Provision & Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Build the SSM command JSON using Python to safely handle
      # secrets with special characters (no shell-escaping issues).
      - name: Build SSM provision + deploy commands
        env:
          EC2_USER:       ${{ secrets.EC2_USER }}
          EC2_PUBLIC_URL: ${{ secrets.EC2_PUBLIC_URL }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          JWT_SECRET:     ${{ secrets.JWT_SECRET }}
          APP_AWS_KEY:    ${{ secrets.AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET:  ${{ secrets.AWS_S3_BUCKET }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          GITHUB_PAT:     ${{ secrets.GITHUB_PAT }}
          GITHUB_REPO:    ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, os, base64

          u       = os.environ['EC2_USER']           # ec2-user or ubuntu
          app_dir = f'/home/{u}/unipulse'
          ec2_url = os.environ['EC2_PUBLIC_URL'].rstrip('/')
          repo    = os.environ['GITHUB_REPO']
          pat     = os.environ.get('GITHUB_PAT', '')

          # Build .env content — base64 encoded so special chars are safe
          env_content = '\n'.join([
              'NODE_ENV=production',
              'PORT=3001',
              f'DATABASE_URL={os.environ["DATABASE_URL"]}',
              f'JWT_SECRET={os.environ["JWT_SECRET"]}',
              f'API_BASE_URL={ec2_url}',
              f'APP_URL={ec2_url}',
              'ALLOWED_ORIGINS=*',
              f'AWS_ACCESS_KEY_ID={os.environ["APP_AWS_KEY"]}',
              f'AWS_SECRET_ACCESS_KEY={os.environ["APP_AWS_SECRET"]}',
              f'AWS_REGION={os.environ["APP_AWS_REGION"]}',
              f'AWS_S3_BUCKET={os.environ["AWS_S3_BUCKET"]}',
              f'SMTP_HOST={os.environ["SMTP_HOST"]}',
              f'SMTP_PORT={os.environ["SMTP_PORT"]}',
              'SMTP_SECURE=false',
              f'SMTP_USER={os.environ["SMTP_USER"]}',
              f'SMTP_PASS={os.environ["SMTP_PASS"]}',
              'CAS_BASE_URL=https://cas.ucr.edu/cas',
          ])
          env_b64 = base64.b64encode(env_content.encode()).decode()

          # Git clone URL — uses PAT for private repos
          clone_url = (
              f'https://x-access-token:{pat}@github.com/{repo}.git'
              if pat else
              f'https://github.com/{repo}.git'
          )
          # After clone, reset remote to clean URL (no token stored)
          clean_url = f'https://github.com/{repo}.git'

          cmds = [
              'set -e',

              # ── 1. SSM Agent ────────────────────────────────────────────
              'echo "=== Step 1: SSM Agent ===" && '
              'systemctl is-active amazon-ssm-agent 2>/dev/null || '
              'systemctl start amazon-ssm-agent 2>/dev/null || true',

              # ── 2. Node.js 20 ────────────────────────────────────────────
              'echo "=== Step 2: Node.js 20 ===" && '
              'if ! node --version 2>/dev/null | grep -q "^v20"; then '
              '  if command -v apt-get &>/dev/null; then '
              '    curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs; '
              '  else '
              '    curl -fsSL https://rpm.nodesource.com/setup_20.x | bash - && yum install -y nodejs; '
              '  fi; '
              'fi && echo "Node: $(node --version)"',

              # ── 3. PM2 ───────────────────────────────────────────────────
              'echo "=== Step 3: PM2 ===" && '
              'command -v pm2 &>/dev/null || npm install -g pm2 && '
              'echo "PM2: $(pm2 --version)"',

              # ── 4. Git ───────────────────────────────────────────────────
              'echo "=== Step 4: git ===" && '
              'command -v git &>/dev/null || '
              '(command -v apt-get &>/dev/null && apt-get install -y git || yum install -y git)',

              # ── 5. Git credentials (private repo support) ────────────────
              f'echo "=== Step 5: git credentials ===" && '
              f'sudo -u {u} git config --global credential.helper store && '
              f'printf "https://x-access-token:{pat}@github.com\\n" | '
              f'sudo -u {u} tee /home/{u}/.git-credentials > /dev/null && '
              f'chmod 600 /home/{u}/.git-credentials'
              if pat else
              f'echo "=== Step 5: skipped (public repo) ==="',

              # ── 6. Clone or pull ─────────────────────────────────────────
              f'echo "=== Step 6: sync repo ===" && '
              f'if [ -d {app_dir}/.git ]; then '
              f'  sudo -u {u} git -C {app_dir} pull origin main; '
              f'else '
              f'  sudo -u {u} git clone {clone_url} {app_dir} && '
              f'  sudo -u {u} git -C {app_dir} remote set-url origin {clean_url}; '
              f'fi',

              # ── 7. Write .env ─────────────────────────────────────────────
              f'echo "=== Step 7: write .env ===" && '
              f'printf "%s" "{env_b64}" | base64 -d > {app_dir}/.env && '
              f'chown {u}:{u} {app_dir}/.env && '
              f'chmod 600 {app_dir}/.env && '
              f'echo ".env written ($(wc -l < {app_dir}/.env) vars)"',

              # ── 8. Install dependencies ────────────────────────────────────
              f'echo "=== Step 8: npm ci ===" && '
              f'sudo -u {u} bash -c "cd {app_dir}/apps/api-node && npm ci --omit=dev"',

              # ── 9. Start / restart PM2 ─────────────────────────────────────
              f'echo "=== Step 9: PM2 start/restart ===" && '
              f'sudo -u {u} bash -c "'
              f'  pm2 restart unipulse-api 2>/dev/null || '
              f'  pm2 start {app_dir}/apps/api-node/src/index.js --name unipulse-api; '
              f'  pm2 save"',

              # ── 10. PM2 startup on reboot (idempotent) ────────────────────
              f'echo "=== Step 10: PM2 startup ===" && '
              f'STARTUP=$(sudo -u {u} pm2 startup systemd -u {u} --hp /home/{u} 2>&1 | grep "sudo env" || true) && '
              f'[ -n "$STARTUP" ] && eval "$STARTUP" && systemctl enable pm2-{u} 2>/dev/null || true',

              # ── Done ──────────────────────────────────────────────────────
              'echo "=== ✅ Deployment complete ===" && '
              'sleep 3 && '
              'curl -sf http://localhost:3001/health && echo "✅ Health check passed" || '
              'echo "⚠️  API not responding yet — run: pm2 logs unipulse-api"',
          ]

          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump({'commands': cmds}, f)
          print('✅ SSM parameters written')
          PYEOF

      - name: Send SSM command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 600 \
            --output text \
            --query "Command.CommandId")
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for completion
        run: |
          echo "⏳ Waiting for EC2 provisioning + deploy..."
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "[$((i * 10))s] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              # Print output for visibility
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text || true
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed: $STATUS"
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text || true
              exit 1
            fi
          done
          echo "❌ Timed out after 300s"
          exit 1
