name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-node/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api-node/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-node
        run: npm ci

      - name: Run linting
        working-directory: apps/api-node
        run: npm run lint --if-present

      - name: Run tests
        working-directory: apps/api-node
        run: npm test --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link and Deploy
        run: |
          cd apps/api-node
          echo "🚂 Deploying to Railway..."
          railway up --detach 2>&1 || {
            echo "⚠️ Direct deploy failed. Trying with service flag..."
            railway service list 2>&1 || true
            echo "💡 You may need to set RAILWAY_SERVICE secret with your service name"
            echo "   Go to Railway Dashboard → Project → Service → Settings → get service name"
            exit 1
          }
          echo "✅ Deploy initiated!"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify deployment
        run: |
          echo "⏳ Waiting 30s for deployment to stabilize..."
          sleep 30
          echo "✅ API deployed to Railway"
          echo "🔗 Check Railway dashboard for live URL"
