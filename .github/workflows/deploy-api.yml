name: Deploy to AWS EC2 (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-node/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'docker-compose.yml'
      - 'nginx/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api-node/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-node
        run: npm ci

      - name: Lint
        working-directory: apps/api-node
        run: npm run lint --if-present

      - name: Test
        working-directory: apps/api-node
        run: npm test --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test

  # ─── 2. Docker Deploy ──────────────────────────────────────────────────────
  deploy:
    name: Docker Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Build the SSM command JSON using Python to safely handle
      # secrets with special characters (no shell-escaping issues).
      - name: Build SSM Docker deploy commands
        env:
          EC2_USER:       ${{ secrets.EC2_USER }}
          JWT_SECRET:     ${{ secrets.JWT_SECRET }}
          APP_AWS_KEY:    ${{ secrets.AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET:  ${{ secrets.AWS_S3_BUCKET }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          GITHUB_PAT:     ${{ secrets.GITHUB }}
          GITHUB_REPO:    ${{ github.repository }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import json, os, base64

          u       = os.environ['EC2_USER']           # ec2-user or ubuntu
          app_dir = f'/home/{u}/unipulse'
          repo    = os.environ['GITHUB_REPO']
          pat     = os.environ.get('GITHUB_PAT', '')
          domain  = 'unipulse.aarav-shah.com'
          # Use IP for CAS callback so UCR SSO can redirect back correctly
          # (domain DNS may not be configured; IP always works)
          api_ip  = '13.221.61.113'

          # Build .env for docker-compose — base64 encoded for safety
          pg_pass = os.environ.get('POSTGRES_PASSWORD', 'unipulse_secret_2026')
          env_content = '\n'.join([
              'NODE_ENV=production',
              f'POSTGRES_DB=unipulse',
              f'POSTGRES_USER=unipulse',
              f'POSTGRES_PASSWORD={pg_pass}',
              f'JWT_SECRET={os.environ["JWT_SECRET"]}',
              f'API_BASE_URL=http://{api_ip}:3001',
              f'APP_URL=http://{api_ip}:8080',
              'ALLOWED_ORIGINS=*',
              f'AWS_ACCESS_KEY_ID={os.environ["APP_AWS_KEY"]}',
              f'AWS_SECRET_ACCESS_KEY={os.environ["APP_AWS_SECRET"]}',
              f'AWS_REGION={os.environ["APP_AWS_REGION"]}',
              f'AWS_S3_BUCKET={os.environ["AWS_S3_BUCKET"]}',
              f'SMTP_HOST={os.environ["SMTP_HOST"]}',
              f'SMTP_PORT={os.environ["SMTP_PORT"]}',
              'SMTP_SECURE=false',
              f'SMTP_USER={os.environ["SMTP_USER"]}',
              f'SMTP_PASS={os.environ["SMTP_PASS"]}',
              'CAS_BASE_URL=https://cas.ucr.edu/cas',
          ])
          env_b64 = base64.b64encode(env_content.encode()).decode()

          # Git clone URL
          clone_url = (
              f'https://x-access-token:{pat}@github.com/{repo}.git'
              if pat else
              f'https://github.com/{repo}.git'
          )
          clean_url = f'https://github.com/{repo}.git'

          cmds = [
              'set -e',
              'export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin',
              'export DEBIAN_FRONTEND=noninteractive',

              # ── 1. Install Docker (quiet) ────────────────────────────────
              'echo "=== Step 1: Docker ===" && '
              'if command -v docker &>/dev/null; then '
              '  echo "Docker already installed: $(docker --version)"; '
              'else '
              '  echo "Installing Docker..." && '
              '  curl -fsSL https://get.docker.com 2>/dev/null | bash -s -- --quiet &>/dev/null && '
              '  systemctl enable docker &>/dev/null && '
              '  systemctl start docker && '
              f'  usermod -aG docker {u} && '
              '  echo "Docker installed: $(docker --version)"; '
              'fi',

              # ── 2. Docker Compose plugin ─────────────────────────────────
              'echo "=== Step 2: Docker Compose ===" && '
              'if docker compose version &>/dev/null; then '
              '  echo "Compose: $(docker compose version)"; '
              'else '
              '  apt-get update -qq && apt-get install -y -qq docker-compose-plugin && '
              '  echo "Compose installed: $(docker compose version)"; '
              'fi',

              # ── 3. Git ───────────────────────────────────────────────────
              'echo "=== Step 3: Git ===" && '
              '(command -v git &>/dev/null && echo "Git: $(git --version)") || '
              '(apt-get update -qq && apt-get install -y -qq git && echo "Git installed")',

              # ── 4. Git credentials ───────────────────────────────────────
              f'echo "=== Step 4: Git credentials ===" && '
              f'sudo -u {u} git config --global credential.helper store && '
              f'printf "https://x-access-token:{pat}@github.com\\n" | '
              f'sudo -u {u} tee /home/{u}/.git-credentials > /dev/null && '
              f'chmod 600 /home/{u}/.git-credentials && echo "Credentials set"'
              if pat else
              f'echo "=== Step 4: skipped (public repo) ==="',

              # ── 5. Clone or pull repo ────────────────────────────────────
              f'echo "=== Step 5: Sync repo ===" && '
              f'if [ -d {app_dir}/.git ]; then '
              f'  sudo -u {u} git -C {app_dir} fetch origin main --quiet && '
              f'  sudo -u {u} git -C {app_dir} reset --hard origin/main --quiet && '
              f'  echo "Repo updated"; '
              f'else '
              f'  sudo -u {u} git clone --quiet {clone_url} {app_dir} && '
              f'  sudo -u {u} git -C {app_dir} remote set-url origin {clean_url} && '
              f'  echo "Repo cloned"; '
              f'fi',

              # ── 6. Write .env ────────────────────────────────────────────
              f'echo "=== Step 6: Write .env ===" && '
              f'printf "%s" "{env_b64}" | base64 -d > {app_dir}/.env && '
              f'chown {u}:{u} {app_dir}/.env && '
              f'chmod 600 {app_dir}/.env && '
              f'echo ".env written ($(wc -l < {app_dir}/.env) vars)"',

              # ── 7. Stop old PM2 if running ───────────────────────────────
              f'echo "=== Step 7: Cleanup ===" && '
              f'(sudo -u {u} bash -c "export PATH=/usr/local/bin:$PATH && pm2 kill" 2>/dev/null || true) && '
              f'echo "Old processes cleaned"',

              # ── 8. Docker Compose up ─────────────────────────────────────
              f'echo "=== Step 8: Docker Compose up ===" && '
              f'cd {app_dir} && '
              f'docker compose down --remove-orphans 2>/dev/null || true && '
              f'echo "Building and starting containers..." && '
              f'docker compose up -d --build --force-recreate 2>&1 | tail -30 && '
              f'echo "" && echo "=== Container Status ===" && '
              f'docker compose ps',

              # ── 9. Wait for health ───────────────────────────────────────
              'echo "" && echo "=== Step 9: Health checks (waiting 20s) ===" && '
              'sleep 20 && '
              'echo "Checking API..." && '
              '(curl -sf http://localhost:3001/health && echo "✅ API healthy") || echo "❌ API not responding" && '
              'echo "Checking Web..." && '
              '(curl -sf http://localhost:8080 > /dev/null && echo "✅ Web healthy") || echo "❌ Web not responding" && '
              'echo "Checking Nginx..." && '
              '(curl -sf http://localhost:80 > /dev/null && echo "✅ Nginx healthy") || echo "❌ Nginx not responding"',

              # ── 10. Show container logs ──────────────────────────────────
              f'echo "" && echo "=== Container Logs (last 10 lines each) ===" && '
              f'echo "--- db ---" && docker logs unipulse-db-1 --tail=5 2>&1 || true && '
              f'echo "--- api ---" && docker logs unipulse-api-1 --tail=10 2>&1 || true && '
              f'echo "--- web ---" && docker logs unipulse-web-1 --tail=5 2>&1 || true && '
              f'echo "--- nginx ---" && docker logs unipulse-nginx-1 --tail=5 2>&1 || true',

              # ── Done ─────────────────────────────────────────────────────
              f'echo "" && echo "=== ✅ Deployment complete ===" && '
              f'echo "🌐 http://{domain}" && '
              f'echo "📡 http://{domain}/health"',
          ]

          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump({'commands': cmds}, f)
          print('✅ SSM parameters written')
          PYEOF

      - name: Send SSM command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 900 \
            --output text \
            --query "Command.CommandId")
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for completion
        run: |
          echo "⏳ Waiting for Docker deploy on EC2..."
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "[$((i * 10))s] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text || true
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed: $STATUS"
              echo ""
              echo "=== STDOUT ==="
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text 2>&1 || true
              echo ""
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text 2>&1 || true
              exit 1
            fi
          done
          echo "❌ Timed out after 600s"
          exit 1
