name: Deploy to AWS EC2 (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-node/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'docker-compose.yml'
      - 'nginx/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api-node/package-lock.json

      - name: Install dependencies
        working-directory: apps/api-node
        run: npm ci

      - name: Lint
        working-directory: apps/api-node
        run: npm run lint --if-present

      - name: Test
        working-directory: apps/api-node
        run: npm test --if-present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test

  # ─── 2. Docker Deploy ──────────────────────────────────────────────────────
  deploy:
    name: Docker Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        env:
          EC2_USER:       ${{ secrets.EC2_USER }}
          JWT_SECRET:     ${{ secrets.JWT_SECRET }}
          APP_AWS_KEY:    ${{ secrets.AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET:  ${{ secrets.AWS_S3_BUCKET }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          GITHUB_PAT:     ${{ secrets.GITHUB }}
          GITHUB_REPO:    ${{ github.repository }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          EC2_PUBLIC_IP:  ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          import json, os, base64
          u = os.environ['EC2_USER']
          app_dir = f'/home/{u}/unipulse'
          pat = os.environ.get('GITHUB_PAT', '')
          repo = os.environ['GITHUB_REPO']
          ip = os.environ.get('EC2_PUBLIC_IP', '')
          pg = os.environ.get('POSTGRES_PASSWORD', 'secret')

          env = base64.b64encode('\n'.join([
            'NODE_ENV=production',
            'POSTGRES_DB=unipulse', 'POSTGRES_USER=unipulse',
            f'POSTGRES_PASSWORD={pg}',
            f'JWT_SECRET={os.environ["JWT_SECRET"]}',
            f'API_BASE_URL=http://{ip}:3001',
            f'APP_URL=http://{ip}:3001',
            'ALLOWED_ORIGINS=*',
            f'AWS_ACCESS_KEY_ID={os.environ["APP_AWS_KEY"]}',
            f'AWS_SECRET_ACCESS_KEY={os.environ["APP_AWS_SECRET"]}',
            f'AWS_REGION={os.environ["APP_AWS_REGION"]}',
            f'AWS_S3_BUCKET={os.environ["AWS_S3_BUCKET"]}',
            f'SMTP_HOST={os.environ["SMTP_HOST"]}',
            f'SMTP_PORT={os.environ["SMTP_PORT"]}',
            'SMTP_SECURE=false',
            f'SMTP_USER={os.environ["SMTP_USER"]}',
            f'SMTP_PASS={os.environ["SMTP_PASS"]}',
            'CAS_BASE_URL=https://cas.ucr.edu/cas',
          ]).encode()).decode()

          clone = f'https://x-access-token:{pat}@github.com/{repo}.git' if pat else f'https://github.com/{repo}.git'

          script = f"""#!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq docker.io docker-compose git
          systemctl start docker
          usermod -aG docker {u}
          if [ -d {app_dir}/.git ]; then
            git -C {app_dir} fetch origin main -q && git -C {app_dir} reset --hard origin/main -q
          else
            git clone -q {clone} {app_dir}
          fi
          printf '%s' '{env}' | base64 -d > {app_dir}/.env
          cd {app_dir}
          docker-compose down --remove-orphans 2>/dev/null || true
          docker-compose up -d --build --force-recreate
          sleep 15
          curl -sf http://localhost:3001/health && echo 'API healthy' || echo 'API not responding'
          docker-compose ps
          """

          import json
          with open('/tmp/ssm-params.json', 'w') as f:
            json.dump({'commands': [script]}, f)
          print('Done')
        shell: python3 {0}

      - name: Send SSM command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for completion
        run: |
          echo "⏳ Waiting for Docker deploy on EC2..."
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "[$((i * 10))s] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text || true
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed: $STATUS"
              echo ""
              echo "=== STDOUT ==="
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text 2>&1 || true
              echo ""
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text 2>&1 || true
              exit 1
            fi
          done
          echo "❌ Timed out after 600s"
          exit 1
