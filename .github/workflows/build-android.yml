name: Build Android (Google Play)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

env:
  NODE_VERSION: '20'

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Write Google Play service account
        # Only needed for production submit — write from secret to file
        if: github.event.inputs.profile == 'production' || (github.event.inputs.profile == '' && github.ref == 'refs/heads/main')
        working-directory: apps/mobile
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-services.json
          echo "✅ Google Play service account written"

      - name: Build Android
        working-directory: apps/mobile
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "🤖 Building Android ($PROFILE)..."
          eas build --platform android --profile "$PROFILE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EC2_PUBLIC_URL }}

      - name: Submit to Google Play Store
        if: github.event.inputs.profile == 'production' || (github.event.inputs.profile == '' && github.ref == 'refs/heads/main')
        working-directory: apps/mobile
        run: |
          echo "📦 Submitting to Google Play (internal track)..."
          eas submit --platform android --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Clean up service account file
        if: always()
        working-directory: apps/mobile
        run: rm -f google-services.json

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: build-android
    if: always()

    steps:
      - name: Build Result
        run: |
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "✅ Android build succeeded!"
          else
            echo "❌ Android build failed"
            exit 1
          fi
