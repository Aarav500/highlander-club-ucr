name: Build iOS (App Store)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

env:
  NODE_VERSION: '20'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build iOS
        working-directory: apps/mobile
        run: |
          PROFILE=${{ github.event.inputs.profile || 'production' }}
          echo "🍎 Building iOS ($PROFILE)..."
          eas build --platform ios --profile $PROFILE --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store
        if: github.event.inputs.profile == 'production' || github.ref == 'refs/heads/main'
        working-directory: apps/mobile
        run: |
          echo "📦 Submitting to App Store Connect..."
          eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: build-ios
    if: always()

    steps:
      - name: Build Result
        run: |
          if [ "${{ needs.build-ios.result }}" == "success" ]; then
            echo "✅ iOS build succeeded!"
          else
            echo "❌ iOS build failed"
            exit 1
          fi
