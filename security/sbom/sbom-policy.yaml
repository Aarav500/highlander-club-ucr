# SBOM Policy — Approved Licenses & Vulnerability Thresholds

licenses:
  approved:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - 0BSD
    - Unlicense
    - CC0-1.0
    - CC-BY-4.0
    - Python-2.0
    - BlueOak-1.0.0

  review_required:
    - GPL-2.0-only
    - GPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
    - MPL-2.0
    - EPL-2.0
    - CDDL-1.0

  blocked:
    - GPL-3.0-only
    - GPL-3.0-or-later
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - SSPL-1.0
    - EUPL-1.2
    - OSL-3.0

vulnerability_thresholds:
  # Block deployment if these thresholds are exceeded
  critical: 0      # Zero tolerance for critical CVEs
  high: 3          # Max 3 high-severity CVEs (must have remediation plan)
  medium: 10       # Max 10 medium (tracked but not blocking)
  low: unlimited   # Informational only

  # Grace period for new CVEs before blocking
  grace_period_days: 7

sbom_requirements:
  format:
    - spdx-json
    - cyclonedx-json
  generation: every_release
  retention: 3_years
  storage: security/sbom/releases/
