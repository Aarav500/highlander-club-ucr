# ============================================================================
# UniPulse — Highlander Events Platform
# Docker Compose — Full Stack Deployment
# ============================================================================

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unipulse}
      POSTGRES_USER: ${POSTGRES_USER:-unipulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unipulse_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unipulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API Backend (Express) ────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api-node
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-unipulse}:${POSTGRES_PASSWORD:-unipulse_secret}@db:5432/${POSTGRES_DB:-unipulse}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: "*"
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CAS_BASE_URL: https://cas.ucr.edu/cas
      DATABASE_SSL: "false"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Web Frontend (Express + Static) ─────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 8080
      API_TARGET: http://api:3001
    ports:
      - "8080:8080"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot

  # ── Certbot (SSL — run manually after first deploy) ─────────────────────
  certbot:
    image: certbot/certbot
    depends_on:
      - nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    # Run: docker compose run certbot certonly --webroot -w /var/www/certbot -d unipulse.aarav-shah.com --agree-tos --email YOUR_EMAIL --non-interactive
    entrypoint: "echo 'Run: docker compose run certbot certonly --webroot -w /var/www/certbot -d unipulse.aarav-shah.com'"

volumes:
  pgdata:
  certbot-etc:
  certbot-var:
  certbot-www:
